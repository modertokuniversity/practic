services:
  db:
    image: postgres:16-alpine
    container_name: timetrack_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: timetrack
      POSTGRES_USER: timetrack_user
      POSTGRES_PASSWORD: timetrack_pass
      TZ: Europe/Kyiv
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetrack_user -d timetrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: timetrack_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@timetrack.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
